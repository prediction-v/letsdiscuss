<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Let's Discuss</title>
  <link rel="stylesheet" href="login.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header class="nav">
    <div class="nav-inner">
      <a href="index.html" class="brand">Let's<span>Discuss</span></a>
      <nav class="nav-links">
        <a href="index.html">Feed</a>
        <a href="profile.html">Profile</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="auth-card">

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" id="tabLogin">Log in</button>
        <button class="tab" id="tabSignup">Sign up</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="form">
        <h2>Welcome back</h2>
        <label>
          Email
          <input type="email" id="loginEmail" required autocomplete="email" />
        </label>
        <label>
          Password
          <input type="password" id="loginPassword" required autocomplete="current-password" />
        </label>
        <p class="error" id="loginError"></p>
        <button type="submit" id="loginSubmit">Log in</button>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm" class="form hidden">
        <h2>Create account</h2>
        <label>
          Username
          <input type="text" id="signupUsername" required
                 minlength="3" maxlength="20"
                 placeholder="3–20 chars, letters/numbers/_"
                 autocomplete="username" />
        </label>
        <label>
          Email
          <input type="email" id="signupEmail" required autocomplete="email" />
        </label>
        <label>
          Password
          <input type="password" id="signupPassword" required
                 minlength="6" autocomplete="new-password"
                 placeholder="At least 6 characters" />
        </label>
        <p class="error" id="signupError"></p>
        <button type="submit" id="signupSubmit">Sign up</button>
      </form>

    </div>
  </main>

  <script src="login.js"></script>
</body>
</html>
